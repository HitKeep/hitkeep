<app-page-frame>
    <section class="utm-shell" [attr.aria-label]="'nav.utm' | transloco">
        <p-tabs class="hk-page-tabs utm-tabs" [value]="activeTab()" (valueChange)="onTabChange($event)">
            <p-tablist>
                <p-tab value="analytics"
                    ><span class="utm-tab-label"><i class="pi pi-chart-bar" aria-hidden="true"></i><span>{{ "nav.analytics" | transloco }}</span></span></p-tab
                >
                @if (!isShareMode()) {
                <p-tab value="builder">
                    <span class="utm-tab-label">
                        <i class="pi pi-link" aria-hidden="true"></i>
                        <span>{{ "nav.utmBuilder" | transloco }}</span>
                    </span>
                </p-tab>
                }
                <p-tab value="qr-codes">
                    <span class="utm-tab-label">
                        <i class="pi pi-qrcode" aria-hidden="true"></i>
                        <span>{{ "nav.qrCodes" | transloco }}</span>
                    </span>
                </p-tab>
            </p-tablist>
        </p-tabs>

        <div class="utm-content">
            <router-outlet />
        </div>
    </section>
</app-page-frame>
