@if (!isShareMode()) {
<p-confirmdialog />

<section class="flex flex-col gap-4">
    <div class="flex flex-wrap items-start justify-between gap-3">
        <p class="m-0 max-w-2xl text-sm text-[var(--p-text-muted-color)]">{{ "share.dialog.description" | transloco }}</p>
        <p-button [label]="'share.dialog.generateAction' | transloco" icon="pi pi-link" (onClick)="generateShareLink()" [loading]="createLoading()" [disabled]="!canManageShares()" styleClass="shrink-0" />
    </div>

    @if (notice(); as noticeMessage) {
    <div
        class="hk-feedback-message flex items-center gap-3"
        [class.hk-feedback-message--success]="noticeMessage.kind === 'success'"
        [class.hk-feedback-message--error]="noticeMessage.kind === 'error'"
        [attr.role]="noticeMessage.kind === 'error' ? 'alert' : 'status'"
        [attr.aria-live]="noticeMessage.kind === 'error' ? 'assertive' : 'polite'"
    >
        <i class="pi" [class.pi-check-circle]="noticeMessage.kind === 'success'" [class.pi-exclamation-circle]="noticeMessage.kind === 'error'" aria-hidden="true"></i>
        <span class="font-medium">{{ noticeMessage.key | transloco }}</span>
    </div>
    }

    <app-table
        [value]="shareLinks()"
        [columns]="shareLinkColumns"
        stateKey="share-links"
        [loading]="linksLoading()"
        [defaultSort]="{ field: 'created_at', order: -1 }"
        [rowActions]="shareLinkActions"
        [rowActionsLoading]="shareLinkActionLoading"
        [exportable]="false"
        emptyTextKey="share.dialog.empty"
        data-testid="share-links-table"
    >
        <ng-template appTableCell="token_hint" let-link><code class="share-token">{{ link.token_hint }}</code></ng-template>
        <ng-template appTableCell="url" let-link>
            @if (link.url) {
            <input pInputText readonly [value]="link.url" class="share-url-input w-full" [attr.aria-label]="'share.dialog.shareUrlLabel' | transloco" />
            } @else {
            <span class="text-sm text-[var(--p-text-muted-color)]">{{ "share.dialog.urlUnavailable" | transloco }}</span>
            }
        </ng-template>
    </app-table>
</section>
}
