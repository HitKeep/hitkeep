<div class="focus-layout flex h-dvh w-full flex-col bg-[var(--p-surface-ground)]">
    <app-layout-page-bar [desktop]="desktop()" />
    <p-splitter
        class="focus-shell"
        [class.sidebar-hidden]="sidebarHidden()"
        [panelSizes]="panelSizes()"
        [minSizes]="minSizes()"
        [step]="8"
        [pt]="{ panel: {}, gutter: { role: 'presentation' }, gutterHandle: { role: 'separator', 'aria-label': ('nav.resizeSidebar' | transloco), 'aria-orientation': 'vertical', 'aria-valuemin': 220, 'aria-valuemax': 320, 'aria-valuenow': context.sidebarWidthPx() } }"
        (onResizeEnd)="onSidebarResize($event)"
    >
        <ng-template #panel>
            <app-layout-sidebar [hiddenDesktop]="sidebarHidden()" />
        </ng-template>
        <ng-template #panel>
            <main class="flex-1 flex flex-col h-full min-w-0 overflow-hidden relative" role="main" [attr.aria-label]="'nav.contentAreaAria' | transloco">
                <div class="flex-1 overflow-y-auto p-4 md:p-8 md:pt-4 relative">
                    @if (context.hasPageHeader()) {
                    <div class="mb-6 flex min-h-9 flex-wrap items-center justify-between gap-4 border-b border-surface-200 pb-4 dark:border-surface-700">
                        <div class="min-w-0 flex-1"><ng-container [ngTemplateOutlet]="context.pageHeaderLeft()" /></div>
                        @if (context.pageHeaderRight(); as right) {
                        <div class="flex flex-wrap gap-2"><ng-container [ngTemplateOutlet]="right" /></div>
                        }
                    </div>
                    } @if (!context.hasPageHeader() && dashboardTitle.pageTitle(); as heading) {
                    <h1 class="mb-5 text-xl font-semibold tracking-tight text-color">{{ heading }}</h1>
                    }
                    <app-free-plan-retention-notice />
                    @if (navigationNotice.key(); as noticeKey) {
                    <p-message class="mb-4 block" severity="warn" [closable]="true" (onClose)="navigationNotice.clear()">{{ noticeKey | transloco }}</p-message>
                    }
                    <router-outlet />
                </div>
            </main>
        </ng-template>
    </p-splitter>
    <app-layout-overlays />
</div>
