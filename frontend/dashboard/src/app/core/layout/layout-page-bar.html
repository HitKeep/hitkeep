<div class="mb-4 hidden items-center gap-2 md:mb-6 md:flex">
    <button
        type="button"
        (click)="desktop() ? context.toggleSidebar() : context.isMobileDrawerOpen.set(true)"
        [attr.aria-label]="'nav.mainSidebarAria' | transloco"
        [attr.aria-expanded]="!context.isSidebarCollapsed()"
        class="size-9 shrink-0 rounded-md hover:bg-surface-100 dark:hover:bg-surface-800 focus-visible:ring-2 focus-visible:ring-primary-500"
    >
        <i class="pi pi-bars" aria-hidden="true"></i>
    </button>
    @if (!shareService.isShareMode() && !context.isOverviewPage()) {
    <app-site-selector class="w-52 min-w-0 shrink-0 lg:w-60" [sites]="siteService.sites()" [current]="siteService.activeSite()" [loading]="siteService.isLoading()" (siteSelected)="context.onSiteSelected($event)" />
    <button
        type="button"
        (click)="context.openSiteSettings('general')"
        [disabled]="!siteService.activeSite()"
        class="cursor-pointer flex size-9 shrink-0 items-center justify-center rounded-md border border-surface-200 text-muted-color transition-colors hover:bg-surface-100 hover:text-[var(--p-text-color)] focus:outline-none focus:ring-2 focus:ring-primary-500 disabled:cursor-not-allowed disabled:opacity-50 dark:border-surface-700 dark:hover:bg-surface-800"
        [attr.aria-label]="'sites.selector.siteSettingsAria' | transloco"
        [title]="'sites.selector.siteSettingsAria' | transloco"
    >
        <i class="pi pi-cog" aria-hidden="true"></i>
    </button>
    }
    <span class="flex-1"></span>
    @if (!shareService.isShareMode()) {
    <app-team-switcher
        class="max-w-[16rem]"
        [teams]="teamService.teams()"
        [currentTeamId]="teamService.activeTeamId()"
        [loading]="teamService.isLoading()"
        [switching]="teamService.isSwitching()"
        [showBrand]="false"
        [showAdd]="canCreateTeams()"
        [compact]="true"
        [beforeSwitch]="beforeTeamSwitch"
        (teamSelected)="context.onTeamSelected($event)"
        (addClicked)="isCreateTeamVisible.set(true)"
    />
    }
    <app-user-controls [showMenu]="!shareService.isShareMode()" />
</div>

@if (context.hasPageHeader()) {
<div class="mb-6 flex min-h-[36px] items-center justify-between gap-4 border-b border-surface-200 pb-4 dark:border-surface-700">
    <div class="min-w-0 flex flex-1 items-center">
        <ng-container [ngTemplateOutlet]="context.pageHeaderLeft()" />
    </div>

    @if (context.pageHeaderRight(); as headerRight) {
    <div class="hidden shrink-0 items-center gap-2 md:flex">
        <ng-container [ngTemplateOutlet]="headerRight" />
    </div>
    }
</div>
}
