<header class="focus-header" [class.focus-header--mobile]="!desktop()">
    <div class="focus-header__identity">
        <button
            type="button"
            class="focus-header__toggle"
            [attr.aria-controls]="desktop() ? 'focus-sidebar' : 'focus-mobile-navigation'"
            [attr.aria-haspopup]="desktop() ? null : 'dialog'"
            (click)="desktop() ? context.toggleSidebar() : context.isMobileDrawerOpen.set(true)"
            [attr.aria-expanded]="desktop() ? !context.isSidebarCollapsed() : context.isMobileDrawerOpen()"
            [attr.aria-label]="(desktop() ? (context.isSidebarCollapsed() ? 'nav.expandSidebar' : 'nav.collapseSidebar') : 'nav.openNavigation') | transloco"
        >
            <i class="pi pi-bars" aria-hidden="true"></i>
        </button>
        <app-brand size="small" [compact]="!desktop()" />
    </div>
    <div class="focus-header__context" [attr.aria-busy]="context.isContextPending()">
        @if (!shareService.isShareMode()) {
        <app-team-switcher
            class="focus-header__team"
            [teams]="teamService.teams()"
            [currentTeamId]="teamService.activeTeamId()"
            [loading]="teamService.isLoading()"
            [switching]="context.isContextPending()"
            [showBrand]="false"
            [showAdd]="canCreateTeams()"
            [compact]="true"
            [beforeSwitch]="beforeTeamSwitch"
            (teamSelected)="context.onTeamSelected($event)"
            (addClicked)="isCreateTeamVisible.set(true)"
        />
        <span class="focus-header__divider" aria-hidden="true">/</span>
        <app-site-selector
            class="focus-header__site"
            [sites]="siteService.sites()"
            [current]="siteService.activeSite()"
            [actions]="context.siteActions()"
            [loading]="siteService.isLoading()"
            [disabled]="context.isContextPending()"
            (siteSelected)="context.onSiteSelected($event)"
        />
        <button
            type="button"
            class="focus-header__toggle"
            (click)="context.openSiteSettings('general')"
            [disabled]="!context.canOpenSiteSettings() || context.isContextPending()"
            [attr.aria-label]="'sites.selector.siteSettingsAria' | transloco"
            [title]="'sites.selector.siteSettingsAria' | transloco"
        >
            <i class="pi pi-cog" aria-hidden="true"></i>
        </button>
        } @else {
        <span class="truncate text-sm font-medium" [title]="shareService.site()?.domain"><i class="pi pi-lock mr-2 text-muted-color" aria-hidden="true"></i>{{ shareService.site()?.domain }}</span>
        }
    </div>
    <div class="focus-header__actions">
        <app-navigation-search [disabled]="context.isContextPending()" />
        @if (showAskAI()) {
        <button type="button" class="ask-ai-trigger" [disabled]="!siteService.activeSite() || context.isContextPending()" [attr.aria-label]="'askAi.triggerAria' | transloco" (click)="askAI.requestOpen()">
            <i class="pi pi-sparkles" aria-hidden="true"></i><span>{{ 'askAi.title' | transloco }}</span>
        </button>
        }
        <app-user-controls [compact]="true" [showMenu]="!shareService.isShareMode()" />
    </div>
</header>
