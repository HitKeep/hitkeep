name: Campaign Cloud QA
on:
  push:
    branches: [qa/bf26-cloud-proof]
permissions:
  contents: read
concurrency:
  group: bf26-cloud-proof
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        gate: [cloud-test, cloud-build, cloud-image, self-hosted-image, default-tenant-migration-acceptance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f472e83a460331d8c3f76b7c03a511df3502b1ba
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run the selected gate against the candidate
        env:
          GATE: ${{ matrix.gate }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f472e83a460331d8c3f76b7c03a511df3502b1ba
          plan_id="$(./hk qa plan full --base origin/main --output json | jq -er '.data.plan_id')"
          ./hk qa full --plan-id "$plan_id" --gate "$GATE"
