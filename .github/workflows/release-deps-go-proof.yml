name: Backend dependency compatibility proof
on:
  push:
    branches: [qa/release-deps-go]
permissions:
  contents: read
jobs:
  release-checks:
    name: ${{ matrix.gate }}
    strategy:
      fail-fast: false
      matrix:
        gate: [cloud-build, cloud-test, default-tenant-migration-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GOTOOLCHAIN: local
      GATE: ${{ matrix.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d918af956ce635e3fa3da2d5cfc5d6c98260db35
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run canonical release gate
        run: |
          id=$(./hk qa plan full --output json | jq -er '.data.plan_id')
          ./hk qa full --plan-id "$id" --gate "$GATE"
  storage:
    name: DuckDB file upgrade and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkpoint actual files across both engine versions
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          for version in 2.0.0 2.0.1; do
            curl -fsSL --retry 3 "https://github.com/duckdb/duckdb/releases/download/v$version/duckdb-cli-linux-amd64.tar.gz" -o "$version.tar.gz"
          done
          echo 'c6507206baf7793c6013dbd82368469a45f20dc0e17a6f92f204602f652ed2bc  2.0.0.tar.gz' | sha256sum -c -
          echo 'b676268be4d39e4e41a904442c9796c9914e645cc085c7505f048f2c992b5eca  2.0.1.tar.gz' | sha256sum -c -
          for version in 2.0.0 2.0.1; do
            mkdir "$version"
            tar -xf "$version.tar.gz" -C "$version"
            cli=$(find "$version" -type f -name duckdb -print -quit)
            test -x "$cli"
            ln -s "$PWD/$cli" "cli-$version"
            "./cli-$version" -version
          done
          for floor in v1.0.0 v1.4.0; do
            file="$PWD/probe-$floor.db"
            ./cli-2.0.0 -bail -c "ATTACH '$file' AS prior (STORAGE_VERSION '$floor'); CREATE TABLE prior.probe(id INT PRIMARY KEY); INSERT INTO prior.probe VALUES (7); CHECKPOINT prior;"
            ./cli-2.0.1 -bail -c "SET storage_compatibility_version='v1.0.0'; ATTACH '$file' AS candidate; INSERT INTO candidate.probe VALUES (11); CHECKPOINT candidate;"
            result=$(./cli-2.0.0 -batch -csv -noheader -readonly "$file" -c "SELECT tags['storage_version'], (SELECT sum(id) FROM probe) FROM duckdb_databases() WHERE database_name=current_database()")
            echo "$floor -> $result"
            test "$result" = "$floor+,18"
          done
