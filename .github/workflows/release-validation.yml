name: Release validation

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  select:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      selected: ${{ steps.paths.outputs.selected }}
    steps:
      - id: paths
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          [[ "$CHANGED_FILES" =~ ^[0-9]+$ ]]
          if (( CHANGED_FILES > 3000 )); then
            echo "pull request changes exceed the PR-files API limit" >&2
            exit 1
          fi
          selected=false
          observed=0
          page=1
          while :; do
            if (( page > 100 )); then
              echo "pull request file list exceeded 100 pages" >&2
              exit 1
            fi
            files="$(curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100&page=$page")"
            jq -e 'type == "array"' <<<"$files" >/dev/null
            count="$(jq -er 'length' <<<"$files")"
            observed=$((observed + count))
            if (( observed > CHANGED_FILES )); then
              echo "pull request file count exceeds event count" >&2
              exit 1
            fi
            if jq -e 'any(.[]; .filename as $path | $path == ".github/workflows/release-validation.yml" or $path == ".github/workflows/pipeline.yml" or $path == "scripts/release/package-source.sh" or $path == ".goreleaser.yaml" or $path == "Dockerfile" or ($path | startswith("charts/hitkeep/")) or ($path | startswith("frontend/dashboard/")) or $path == "go.mod" or $path == "go.sum" or $path == "hitkeep.example.yaml" or $path == "scripts/helm-smoke.sh" or $path == "tests/fixtures/release-fixtures.json" or $path == ".release-please-manifest.json")' <<<"$files" >/dev/null; then
              selected=true
              break
            fi
            if (( observed == CHANGED_FILES )); then
              break
            fi
            if (( count < 100 )); then
              echo "pull request file list ended before the event count" >&2
              exit 1
            fi
            page=$((page + 1))
          done
          if [[ "$selected" == false ]] && (( observed != CHANGED_FILES )); then
            echo "pull request file list is incomplete" >&2
            exit 1
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

  required:
    name: Required release validation
    if: always()
    needs:
      - select
      - homebrew-source
      - homebrew-candidate
      - cross-cgo
      - helm-lifecycle
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce selected validation
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ['RESULTS'])
          jobs = {'select', 'homebrew-source', 'homebrew-candidate', 'cross-cgo', 'helm-lifecycle'}
          if set(results) != jobs:
              raise SystemExit('Missing release validation dependencies')
          event = os.environ['EVENT_NAME']
          if event == 'pull_request':
              selected = results['select'].get('outputs', {}).get('selected')
              if results['select']['result'] != 'success' or selected not in ('true', 'false'):
                  raise SystemExit('Selector must succeed with a boolean output')
              # Forks cannot use release credentials; validate on a maintainer branch before release.
              expensive = selected == 'true' and os.environ['HEAD_REPOSITORY'] == os.environ['GITHUB_REPOSITORY']
              homebrew = expensive and os.environ['HEAD_REF'].startswith('release-please--branches--main')
              expected = {'select': 'success'}
          elif event == 'workflow_dispatch':
              expensive = homebrew = True
              expected = {'select': 'skipped'}
          else:
              raise SystemExit('Unexpected release validation event')
          expected.update({job: 'success' if enabled else 'skipped' for job, enabled in (
              ('cross-cgo', expensive), ('helm-lifecycle', expensive),
              ('homebrew-source', homebrew), ('homebrew-candidate', homebrew))})
          for job, wanted in expected.items():
              result = results[job]['result']
              if result != wanted:
                  raise SystemExit(f'{job}: expected {wanted}, got {result!r}')
          PY

  homebrew-source:
    needs: select
    if: >-
      always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.select.outputs.selected == 'true' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--branches--main')))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.source.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build candidate dashboard assets
        run: |
          ./hk ci build-dashboard
          ./hk ci restore-dashboard --archive public-assets.tar.gz
      - name: Package candidate source with built dashboard
        run: |
          VERSION="v$(jq -er '."."' .release-please-manifest.json)" \
          SOURCE_SHA="$(git rev-parse HEAD)" \
            bash scripts/release/package-source.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: source
        with:
          name: homebrew-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-package/*.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  homebrew-candidate:
    needs: [select, homebrew-source]
    if: >-
      always() && needs.homebrew-source.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.select.outputs.selected == 'true' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--branches--main')))
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Homebrew
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          printf '%s\n' "$HOMEBREW_PREFIX/bin" >> "$GITHUB_PATH"
          printf 'HOMEBREW_PREFIX=%s\n' "$HOMEBREW_PREFIX" >> "$GITHUB_ENV"
          printf 'HOMEBREW_CELLAR=%s\n' "$HOMEBREW_CELLAR" >> "$GITHUB_ENV"
          printf 'HOMEBREW_REPOSITORY=%s\n' "$HOMEBREW_REPOSITORY" >> "$GITHUB_ENV"
      - name: Install current stable formula
        run: |
          set -euo pipefail
          brew tap HitKeep/hitkeep
          stable_version="$(brew info --json=v2 HitKeep/hitkeep/hitkeep | jq -er '.formulae[0].versions.stable')"
          [[ "$stable_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          brew install --build-from-source HitKeep/hitkeep/hitkeep
          test "$(hitkeep --version)" = "$stable_version"
          printf 'STABLE_VERSION=%s\n' "$stable_version" >> "$GITHUB_ENV"
      - name: Resolve candidate
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            candidate_version="$(jq -er '."."' .release-please-manifest.json)"
            [[ "$candidate_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          else
            candidate_version="$(ruby -e 'parts = ARGV[0].split(".").map(&:to_i); puts "#{parts[0]}.#{parts[1]}.#{parts[2] + 1}-validation.#{ARGV[1]}.#{ARGV[2]}"' "$STABLE_VERSION" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          fi
          ruby -e 'require "rubygems"; abort unless Gem::Version.new(ARGV[1]) > Gem::Version.new(ARGV[0])' \
            "$STABLE_VERSION" "$candidate_version"
          printf 'CANDIDATE_SHA=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_ENV"
          printf 'CANDIDATE_VERSION=%s\n' "$candidate_version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.homebrew-source.outputs.artifact_id }}
          path: ${{ runner.temp }}/source-package
      - name: Prepare candidate formula
        run: |
          set -euo pipefail
          archives=( "$RUNNER_TEMP"/source-package/hitkeep-source-*.tar.gz )
          [[ ${#archives[@]} -eq 1 && -f "${archives[0]}" ]]
          candidate_url="$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).as_uri())' "${archives[0]}")"
          candidate_checksum="$(shasum -a 256 "${archives[0]}" | awk '{print $1}')"
          formula="$(brew --repository HitKeep/hitkeep)/Formula/hitkeep.rb"
          candidate_formula="$(mktemp)"
          awk -v version="$CANDIDATE_VERSION" -v url="$candidate_url" -v checksum="$candidate_checksum" '
            /^  version "/ { print "  version \"" version "\""; versions++; next }
            /^  url "/ {
              if (versions == 0) { print "  version \"" version "\""; versions++ }
              print "  url \"" url "\""; urls++; next
            }
            /^  sha256 "/ { print "  sha256 \"" checksum "\""; checksums++; next }
            { print }
            END { if (versions != 1 || urls != 1 || checksums != 1) exit 1 }
          ' "$formula" > "$candidate_formula"
          mv "$candidate_formula" "$formula"
          ruby -c "$formula"
      - name: Upgrade to and test candidate
        run: |
          set -euo pipefail
          test "$(hitkeep --version)" = "$STABLE_VERSION"
          brew upgrade --build-from-source HitKeep/hitkeep/hitkeep
          test "$(hitkeep --version)" = "$CANDIDATE_VERSION"
          brew test HitKeep/hitkeep/hitkeep
          brew uninstall hitkeep
          ! command -v hitkeep

  cross-cgo:
    needs: select
    if: >-
      always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.select.outputs.selected == 'true' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build dashboard assets
        run: |
          ./hk ci build-dashboard
          ./hk ci restore-dashboard --archive public-assets.tar.gz
      - name: Install arm64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Prepare release configuration artifacts
        env:
          RELEASE_INPUTS_DIR: ${{ runner.temp }}/release-inputs
          RELEASE_TAG_NAME: v0.0.0-validation.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG_NAME#v}"
          release_inputs="${RELEASE_INPUTS_DIR:?}"
          mkdir -p "$release_inputs"
          ./hk catalog configuration --output json \
            | jq --arg tag "$RELEASE_TAG_NAME" --arg version "$release_version" \
              '.data + {release_tag: $tag, release_version: $version}' \
            > "$release_inputs/hitkeep-configuration.json"
          env -u GOROOT go run ./cmd/hitkeep config init --output "$release_inputs/hitkeep.example.yaml"
          cmp "$release_inputs/hitkeep.example.yaml" hitkeep.example.yaml
          ./hk catalog configuration-manifest \
            --catalog "$release_inputs/hitkeep-configuration.json" \
            --example "$release_inputs/hitkeep.example.yaml" \
            --output json \
            | jq -c '.data' > "$release_inputs/hitkeep-configuration-manifest.json"
          cp "$release_inputs"/hitkeep-configuration.json .
          cp "$release_inputs"/hitkeep.example.yaml .
          cp "$release_inputs"/hitkeep-configuration-manifest.json .
      - name: Build and verify cross-CGO archives
        env:
          HITKEEP_VERSION: v0.0.0-validation.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          HITKEEP_ARCHIVE_VERSION="${HITKEEP_VERSION#v}" \
            env -u GOROOT go run github.com/goreleaser/goreleaser/v2@v2.19.0 release \
              --snapshot --clean --skip=publish --config .goreleaser.yaml
          for arch in amd64 arm64; do
            mapfile -t archives < <(find dist -maxdepth 1 -type f -name "hitkeep_*_Linux_${arch}.tar.gz")
            test "${#archives[@]}" -eq 1
            extract_dir="$(mktemp -d)"
            tar -xzf "${archives[0]}" -C "$extract_dir"
            binary="$extract_dir/hitkeep-linux-${arch}"
            test -x "$binary"
            build_metadata="$(go version -m "$binary")"
            grep -Fq 'GOOS=linux' <<< "$build_metadata"
            grep -Fq "GOARCH=${arch}" <<< "$build_metadata"
            grep -Fq 'CGO_ENABLED=1' <<< "$build_metadata"
            if [[ "$arch" == amd64 ]]; then
              test "$("$binary" --version)" = "$HITKEEP_VERSION"
            else
              strings "$binary" | grep -Fxq "$HITKEEP_VERSION"
            fi
            rm -rf "$extract_dir"
          done
          (cd dist && sha256sum --check SHA256SUMS)

  helm-lifecycle:
    needs: select
    if: >-
      always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.select.outputs.selected == 'true' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install Kind
        run: env -u GOROOT go install sigs.k8s.io/kind@v0.33.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run disposable Helm lifecycle
        env:
          CANDIDATE_VERSION: 0.0.0-validation.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          kind_bin="$(go env GOPATH)/bin/kind"
          cluster="hitkeep-release-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          registry="hitkeep-registry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          registry_port=5001
          chart_dir="$(mktemp -d)"
          cleanup() {
            "$kind_bin" delete cluster --name "$cluster" || true
            docker rm --force "$registry" >/dev/null 2>&1 || true
            rm -rf "$chart_dir"
          }
          trap cleanup EXIT

          docker run --detach --restart=always \
            --publish "127.0.0.1:${registry_port}:5000" \
            --name "$registry" registry:2
          cat > "$chart_dir/kind.yaml" <<EOF
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
            - |-
              [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:${registry_port}"]
                endpoint = ["http://${registry}:5000"]
          EOF
          "$kind_bin" create cluster --name "$cluster" --config "$chart_dir/kind.yaml"
          docker network connect kind "$registry"

          catalog="$(./hk catalog --output json)"
          local_image="$(jq -r '.data.variants[] | select(.id == "self-hosted") | .local_image' <<< "$catalog")"
          test -n "$local_image"
          ./hk build image --variant self-hosted --output json
          candidate_tag="localhost:${registry_port}/hitkeep:${CANDIDATE_VERSION}"
          docker tag "$local_image" "$candidate_tag"
          push_output="$(docker push "$candidate_tag")"
          printf '%s\n' "$push_output"
          candidate_digest="$(sed -n 's/^.*digest: \(sha256:[a-f0-9]\{64\}\).*$/\1/p' <<< "$push_output" | tail -n 1)"
          [[ "$candidate_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          candidate="localhost:${registry_port}/hitkeep@${candidate_digest}"
          docker pull "$candidate"

          platform="linux/$(docker image inspect "$candidate" --format '{{.Architecture}}')"
          manifest=tests/fixtures/release-fixtures.json
          previous_version="$(jq -r '.supported_upgrade_floor' "$manifest")"
          previous="$(jq -r --arg platform "$platform" --arg version "$previous_version" '.fixtures[] | select(.previous_version == $version and .platform == $platform) | .previous_image' "$manifest")"
          previous_chart="$(jq -r --arg platform "$platform" --arg version "$previous_version" '.fixtures[] | select(.previous_version == $version and .platform == $platform) | .previous_chart' "$manifest")"
          previous_chart_digest="$(jq -r --arg platform "$platform" --arg version "$previous_version" '.fixtures[] | select(.previous_version == $version and .platform == $platform) | .previous_chart_digest' "$manifest")"
          [[ "$previous" == *@sha256:* ]]
          [[ "$previous_chart" == oci://* ]]
          [[ "$previous_chart_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "$previous"

          helm package charts/hitkeep \
            --version "$CANDIDATE_VERSION" \
            --app-version "$CANDIDATE_VERSION" \
            --destination "$chart_dir" >/dev/null
          candidate_chart="$chart_dir/hitkeep-${CANDIDATE_VERSION}.tgz"
          test -f "$candidate_chart"
          previous_output="$(helm pull "$previous_chart" --version "$previous_version" --destination "$chart_dir" 2>&1)"
          printf '%s\n' "$previous_output"
          grep -Fqx "Digest: $previous_chart_digest" <<< "$previous_output"
          previous_chart_file="$chart_dir/hitkeep-${previous_version#v}.tgz"
          test -f "$previous_chart_file"

          HITKEEP_PREVIOUS_IMAGE="$previous" \
          HITKEEP_PREVIOUS_CHART="$previous_chart_file" \
          HITKEEP_PREVIOUS_CHART_DIGEST="$previous_chart_digest" \
          HITKEEP_CANDIDATE_CHART="$candidate_chart" \
          HITKEEP_CANDIDATE_CHART_VERSION="$CANDIDATE_VERSION" \
            bash ./scripts/helm-smoke.sh "$candidate" self-hosted
