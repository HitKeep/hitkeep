name: Build Pipeline

on:
  workflow_call:
    outputs:
      image_digest:
        description: "Immutable digest of the exact-version candidate image"
        value: ${{ jobs.build-and-push-image.outputs.image_digest }}
    inputs:
      stable_candidate:
        type: boolean
        default: false
        description: Build unpublished stable candidate inputs
      version:
        required: true
        type: string
        description: "Version string to embed in the binary (e.g., v1.0.0 or snapshot-abc)"
      meta_config:
        required: true
        type: string
        description: "Configuration for docker/metadata-action tags"
      checkout_ref:
        required: false
        type: string
        default: ""
        description: "Git ref or SHA to check out for build jobs (defaults to the workflow SHA)"
      release_source_tag:
        required: false
        type: string
        default: ""
        description: "Existing immutable tag whose commit supplies a tagged release build"
      release_source_sha:
        required: false
        type: string
        default: ""
        description: "Expected commit SHA for release_source_tag"
      upload_to_release:
        required: false
        type: boolean
        default: false
        description: "Whether to upload binaries to a GitHub Release"
      release_prerelease:
        required: false
        type: boolean
        default: false
        description: "Whether to create the target GitHub Release as a prerelease before uploading binaries"
      release_tag_name:
        required: false
        type: string
        description: "The tag name of the release to upload to (required if upload_to_release is true)"
      release_target_sha:
        required: false
        type: string
        default: ""
        description: "Commit SHA to target when creating or updating a prerelease"
      release_title:
        required: false
        type: string
        default: ""
        description: "Title to use when creating or updating a prerelease"
      release_notes:
        required: false
        type: string
        default: ""
        description: "Markdown release notes to use when creating or updating a prerelease"
      docker_tags_summary:
        required: false
        type: string
        default: ""
        description: "Markdown list of Docker tags to append to prerelease notes"
      docker_sha_tag_prefix:
        required: false
        type: string
        default: ""
        description: "Prefix for the short-SHA Docker tag shown in prerelease notes"
    secrets:
      token:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false

jobs:
  build-dashboard:
    name: Build dashboard assets
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: $/.github/actions/setup-node-npm

      - name: Build deterministic dashboard archive
        run: ./hk ci build-dashboard

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-assets-${{ inputs.version }}
          path: public-assets.tar.gz
          retention-days: ${{ inputs.stable_candidate && 30 || 1 }}
          compression-level: 0

  build-configuration:
    name: Generate release configuration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate release configuration inputs
        env:
          RELEASE_INPUTS_DIR: ${{ runner.temp }}/hitkeep-release-inputs
          RELEASE_TAG_NAME: ${{ inputs.release_tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG_NAME#v}"
          release_inputs="${RELEASE_INPUTS_DIR:?}"
          mkdir -p "$release_inputs"
          ./hk catalog configuration --output json \
            | jq --arg tag "$RELEASE_TAG_NAME" --arg version "$release_version" \
              '.data + {release_tag: $tag, release_version: $version}' \
            > "$release_inputs/hitkeep-configuration.json"
          env -u GOROOT go run ./cmd/hitkeep config init --output "$release_inputs/hitkeep.example.yaml"
          ./hk catalog configuration-manifest \
            --catalog "$release_inputs/hitkeep-configuration.json" \
            --example "$release_inputs/hitkeep.example.yaml" \
            --output json \
            | jq -c '.data' > "$release_inputs/hitkeep-configuration-manifest.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-inputs-${{ inputs.version }}
          path: ${{ runner.temp }}/hitkeep-release-inputs
          retention-days: ${{ inputs.stable_candidate && 30 || 1 }}
          compression-level: 0

  build-binaries:
    name: Build ${{ matrix.label }}
    needs: build-dashboard
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: linux-amd64
            label: Linux amd64
            runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            artifact_suffix: linux-amd64
            glibc_baseline: "2.35"
          - id: linux-arm64
            label: Linux arm64
            runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            artifact_suffix: linux-arm64
            glibc_baseline: "2.35"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-assets-${{ inputs.version }}
          path: artifacts/public

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Restore embedded public assets
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find artifacts/public -name 'public-assets.tar.gz' -print -quit)"
          test -n "$archive"
          ./hk ci restore-dashboard --archive "$archive"

      - name: Build native Linux binaries with GoReleaser on Ubuntu ${{ matrix.glibc_baseline }}
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          HITKEEP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # DuckDB's prebuilt linux bindings currently need a newer libstdc++
          # than Bullseye provides; Ubuntu 22.04 satisfies that requirement.
          export CC=gcc
          export CXX=g++

          HITKEEP_ARCHIVE_VERSION="${HITKEEP_VERSION#v}" env -u GOROOT go run github.com/goreleaser/goreleaser/v2@v2.19.0 build \
            --snapshot \
            --clean \
            --single-target \
            --id self-hosted \
            --output "hitkeep-${{ matrix.artifact_suffix }}"
          HITKEEP_ARCHIVE_VERSION="${HITKEEP_VERSION#v}" env -u GOROOT go run github.com/goreleaser/goreleaser/v2@v2.19.0 build \
            --snapshot \
            --clean \
            --single-target \
            --id cloud \
            --output "hitkeep-cloud-${{ matrix.artifact_suffix }}"

      - name: Verify native binary versions
        env:
          HITKEEP_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for binary in "hitkeep-${{ matrix.artifact_suffix }}" "hitkeep-cloud-${{ matrix.artifact_suffix }}"; do
            version_output="$("./$binary" --version)"
            test "$version_output" = "$HITKEEP_VERSION"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.id }}
          path: |
            hitkeep-${{ matrix.artifact_suffix }}
            hitkeep-cloud-${{ matrix.artifact_suffix }}
          retention-days: ${{ inputs.stable_candidate && 30 || 1 }}
          compression-level: 0

      - name: Attest Binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            hitkeep-${{ matrix.artifact_suffix }}
            hitkeep-cloud-${{ matrix.artifact_suffix }}

  build-release-archives:
    name: Build multi-architecture release archives
    needs:
      - build-binaries
      - build-configuration
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_source_tag || inputs.checkout_ref || github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-linux-*
          path: .
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs-${{ inputs.version }}
          path: .

      - name: Package and verify prebuilt release archives
        id: release-artifacts
        env:
          HITKEEP_VERSION: ${{ inputs.version }}
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/hitkeep-release-archives
          RELEASE_SOURCE_SHA: ${{ inputs.release_source_sha }}
          RELEASE_SOURCE_TAG: ${{ inputs.release_source_tag }}
          RELEASE_TAG_NAME: ${{ inputs.release_tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RELEASE_ARTIFACT_DIR:?}"
          mkdir -p "$release_dir"
          if [[ -n "$RELEASE_SOURCE_TAG" ]]; then
            test -n "$RELEASE_SOURCE_SHA"
            tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_SOURCE_TAG}^{commit}")"
            test "$tag_commit" = "$RELEASE_SOURCE_SHA"
            test "$tag_commit" = "$(git rev-parse HEAD)"
            test "$RELEASE_SOURCE_TAG" = "$RELEASE_TAG_NAME"
            release_version="${RELEASE_SOURCE_TAG#v}"
          else
            test -n "$RELEASE_TAG_NAME"
            release_version="${RELEASE_TAG_NAME#v}"
          fi
          timestamp="$(git log -1 --format=%ct)"
          for arch in amd64 arm64; do
            archive="$release_dir/hitkeep_${release_version}_Linux_${arch}.tar.gz"
            staging="$(mktemp -d)"
            cp "hitkeep-linux-${arch}" LICENSE README.md hitkeep-configuration.json hitkeep.example.yaml hitkeep-configuration-manifest.json "$staging/"
            mkdir -p "$staging/duckdbextensions"
            cp duckdbextensions/LICENSE.* "$staging/duckdbextensions/"
            chmod 0755 "$staging/hitkeep-linux-${arch}"
            chmod 0644 "$staging/LICENSE" "$staging/README.md" "$staging"/duckdbextensions/LICENSE.* "$staging/hitkeep-configuration.json" "$staging/hitkeep.example.yaml" "$staging/hitkeep-configuration-manifest.json"
            (
              cd "$staging"
              tar --format=posix --owner=0 --group=0 --numeric-owner --mtime="@${timestamp}" --pax-option=delete=atime,delete=ctime --no-recursion -cf - \
                "hitkeep-linux-${arch}" LICENSE README.md duckdbextensions/LICENSE.* hitkeep-configuration.json hitkeep.example.yaml hitkeep-configuration-manifest.json \
                | gzip -n > "$archive"
            )
            diff -u <(printf '%s\n' LICENSE README.md duckdbextensions/LICENSE.* hitkeep-configuration.json hitkeep.example.yaml hitkeep-configuration-manifest.json "hitkeep-linux-${arch}" | LC_ALL=C sort) <(tar -tzf "$archive" | LC_ALL=C sort)
            test "$(tar -tvzf "$archive" "hitkeep-linux-${arch}" | awk '{print $1}')" = "-rwxr-xr-x"
            for file in LICENSE README.md duckdbextensions/LICENSE.* hitkeep-configuration.json hitkeep.example.yaml hitkeep-configuration-manifest.json; do
              test "$(tar -tvzf "$archive" "$file" | awk '{print $1}')" = "-rw-r--r--"
              cmp <(tar -xOzf "$archive" "$file") "$file"
            done
            test "$(sha256sum "hitkeep-linux-${arch}" | awk '{print $1}')" = \
              "$(tar -xOzf "$archive" "hitkeep-linux-${arch}" | sha256sum | awk '{print $1}')"
            if tar -tzf "$archive" | grep -q 'cloud'; then
              exit 1
            fi
          done
          (cd "$release_dir" && sha256sum hitkeep_*.tar.gz | LC_ALL=C sort > goreleaser-SHA256SUMS && sha256sum --check goreleaser-SHA256SUMS)
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives-${{ inputs.version }}
          path: |
            ${{ steps.release-artifacts.outputs.release_dir }}/*.tar.gz
            ${{ steps.release-artifacts.outputs.release_dir }}/goreleaser-SHA256SUMS
          retention-days: ${{ inputs.stable_candidate && 30 || 1 }}
          compression-level: 0

  upload-release-binaries:
    name: Upload release binaries
    needs:
      - build-binaries
      - build-release-archives
    if: ${{ inputs.upload_to_release && inputs.release_tag_name != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: .
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives-${{ inputs.version }}
          path: .
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs-${{ inputs.version }}
          path: .

      - name: Generate and verify release checksums
        run: |
          sha256sum --check goreleaser-SHA256SUMS
          ./hk ci release-checksums
          ./hk ci verify-release

      - name: Upload binaries to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          DOCKER_TAGS_SUMMARY: ${{ inputs.docker_tags_summary }}
          DOCKER_SHA_TAG_PREFIX: ${{ inputs.docker_sha_tag_prefix }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RELEASE_PRERELEASE: ${{ inputs.release_prerelease }}
          RELEASE_TARGET_SHA: ${{ inputs.release_target_sha || github.sha }}
          RELEASE_TAG_NAME: ${{ inputs.release_tag_name }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG_NAME#v}"
          files=(
            hitkeep-cloud-linux-amd64
            hitkeep-cloud-linux-arm64
            hitkeep-linux-amd64
            hitkeep-linux-arm64
            "hitkeep_${release_version}_Linux_amd64.tar.gz"
            "hitkeep_${release_version}_Linux_arm64.tar.gz"
            hitkeep-configuration.json
            hitkeep.example.yaml
            hitkeep-configuration-manifest.json
            SHA256SUMS
          )
          for file in "${files[@]}"; do
            test -f "$file"
          done

          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            short_sha="${RELEASE_TARGET_SHA::7}"
            release_title="${RELEASE_TITLE:-Snapshot ${short_sha}}"

            if [[ -n "$RELEASE_NOTES" ]]; then
              printf '%s\n' "$RELEASE_NOTES" > release-notes.md
            else
              cat > release-notes.md <<EOF
          Automated prerelease build for ${RELEASE_TARGET_SHA}.

          - Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${RELEASE_TARGET_SHA}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
            fi

            if [[ -n "$DOCKER_TAGS_SUMMARY" ]]; then
              {
                dockerhub_repo="${DOCKERHUB_USERNAME}/hitkeep"
                ghcr_repo="ghcr.io/${GITHUB_REPOSITORY,,}"
                ghcr_package_url="${GITHUB_SERVER_URL}/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/package/hitkeep"
                dockerhub_tags_url="https://hub.docker.com/r/${dockerhub_repo}/tags"

                printf '\n## Docker images\n\n'
                printf -- '- GHCR: [%s](%s)\n' "$ghcr_repo" "$ghcr_package_url"
                printf -- '- Docker Hub: [%s](%s)\n\n' "$dockerhub_repo" "$dockerhub_tags_url"
                printf 'Tags:\n\n'
                printf '%s\n' "$DOCKER_TAGS_SUMMARY"

                if [[ -n "$DOCKER_SHA_TAG_PREFIX" ]]; then
                  sha_tag="${DOCKER_SHA_TAG_PREFIX}${short_sha}"
                  printf -- '- `%s`\n' "$sha_tag"
                fi
              } >> release-notes.md
            fi

            if gh release view "${RELEASE_TAG_NAME}" >/dev/null 2>&1; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG_NAME}" -f sha="${RELEASE_TARGET_SHA}" -F force=true
              gh release edit "${RELEASE_TAG_NAME}" \
                --prerelease \
                --target "${RELEASE_TARGET_SHA}" \
                --title "${release_title}" \
                --notes-file release-notes.md
              gh release upload "${RELEASE_TAG_NAME}" "${files[@]}" --clobber
            else
              gh release create "${RELEASE_TAG_NAME}" "${files[@]}" \
                --target "${RELEASE_TARGET_SHA}" \
                --prerelease \
                --latest=false \
                --title "${release_title}" \
                --notes-file release-notes.md
            fi

            exit 0
          fi

          gh release upload "${RELEASE_TAG_NAME}" "${files[@]}" --clobber

  build-and-push-image:
    name: Build and push Docker image
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    needs:
      - build-dashboard
      - build-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-assets-${{ inputs.version }}
          path: artifacts/public

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-linux-*
          path: .
          merge-multiple: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Docker build inputs
        shell: bash
        run: |
          set -euo pipefail

          public_archive="$(find artifacts/public -name 'public-assets.tar.gz' -print -quit)"
          test -n "$public_archive"
          ./hk ci restore-dashboard --archive "$public_archive"
          ./hk ci prepare-public-image

      - name: Resolve exact container toolchain
        id: toolchain
        shell: bash
        run: |
          echo "go=$(./hk ci toolchain go --output plain)" >> "$GITHUB_OUTPUT"
          echo "node=$(./hk ci toolchain node --output plain)" >> "$GITHUB_OUTPUT"
          echo "npm=$(./hk ci toolchain npm --output plain)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        if: ${{ !inputs.stable_candidate }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve GHCR image
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.image.outputs.name }}
            ${{ !inputs.stable_candidate && format('{0}/hitkeep', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: ${{ inputs.meta_config }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          provenance: mode=max
          sbom: true
          pull: true
          build-args: |
            GOLANG_VERSION=${{ steps.toolchain.outputs.go }}
            NODE_VERSION=${{ steps.toolchain.outputs.node }}
            NPM_VERSION=${{ steps.toolchain.outputs.npm }}
            HITKEEP_VERSION=${{ inputs.version }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Attest GHCR Image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker Hub Image
        if: ${{ !inputs.stable_candidate }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hitkeep
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  docs-compatibility:
    if: ${{ inputs.stable_candidate }}
    needs: build-configuration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node-npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs-${{ inputs.version }}
          path: configuration
      - name: Require reviewed docs revision
        env:
          DOCS_REVISION: ${{ vars.HITKEEP_DOCS_VALIDATION_SHA }}
          APP_ID: ${{ vars.HITKEEP_RELEASE_APP_ID }}
        run: |
          [[ "$DOCS_REVISION" =~ ^[a-f0-9]{40}$ && "$APP_ID" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: docs-token
        with:
          app-id: ${{ vars.HITKEEP_RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: HitKeep
          repositories: hitkeep-docs
          permission-contents: read
      - name: Fetch reviewed private validator and revoke fetching credential
        env:
          GH_TOKEN: ${{ steps.docs-token.outputs.token }}
          DOCS_REVISION: ${{ vars.HITKEEP_DOCS_VALIDATION_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'gh api --method DELETE installation/token >/dev/null' EXIT
          gh api "repos/HitKeep/hitkeep-docs/tarball/$DOCS_REVISION" > "$RUNNER_TEMP/docs.tar.gz"
          mkdir "$RUNNER_TEMP/docs-validator"
          tar -xzf "$RUNNER_TEMP/docs.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/docs-validator"
          rm "$RUNNER_TEMP/docs.tar.gz"
      - name: Validate candidate configuration using reviewed docs code
        env:
          TAG: ${{ inputs.release_source_tag }}
          SOURCE_SHA: ${{ inputs.release_source_sha }}
          DOCS_REVISION: ${{ vars.HITKEEP_DOCS_VALIDATION_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/docs-validator"
          node scripts/validate-release-candidate.mjs \
            --configuration "$GITHUB_WORKSPACE/configuration/hitkeep-configuration.json" \
            --manifest "$GITHUB_WORKSPACE/configuration/hitkeep-configuration-manifest.json" \
            --example "$GITHUB_WORKSPACE/configuration/hitkeep.example.yaml" \
            --tag "$TAG" --source-sha "$SOURCE_SHA" --docs-revision "$DOCS_REVISION"

  package-assistant:
    if: ${{ inputs.stable_candidate }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_source_sha }}
          path: app
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: HitKeep/hitkeep-assistant-plugins
          ref: dbe2227280b43d23c0b253f8796c10eb120f82c5
          path: packager
      - name: Generate and verify one canonical assistant package
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.release_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ && "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C app rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(jq -r .version app/frontend/dashboard/package.json)" = "${VERSION#v}"
          test "$(git -C packager rev-parse HEAD)" = dbe2227280b43d23c0b253f8796c10eb120f82c5
          python3 packager/scripts/package.py --sync-from app --source-sha "$SOURCE_SHA" --version "${VERSION#v}"
          python3 packager/scripts/package.py --verify-source app --source-sha "$SOURCE_SHA"
          mkdir "$RUNNER_TEMP/assistant-package"
          python3 packager/scripts/package.py --output "$RUNNER_TEMP/assistant-package/hitkeep-analytics-${VERSION#v}.zip"
          python3 packager/scripts/package.py --output "$RUNNER_TEMP/assistant-repeat.zip"
          cmp "$RUNNER_TEMP/assistant-package/hitkeep-analytics-${VERSION#v}.zip" "$RUNNER_TEMP/assistant-repeat.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assistant-package-${{ inputs.version }}
          path: ${{ runner.temp }}/assistant-package/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  package-source:
    if: ${{ inputs.stable_candidate }}
    needs: build-dashboard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_source_sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-assets-${{ inputs.version }}
          path: artifacts/public
      - name: Package exact source with existing dashboard assets
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.release_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ./hk ci restore-dashboard --archive artifacts/public/public-assets.tar.gz
          bash scripts/release/package-source.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-archive-${{ inputs.version }}
          path: ${{ runner.temp }}/source-package/*.tar.gz
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  package-tracker:
    if: ${{ inputs.stable_candidate }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: $/.github/actions/setup-node-npm
      - working-directory: frontend/dashboard
        run: npm ci --no-audit --no-fund
      - name: Verify and pack tracker once
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          plan_id="$(./hk qa plan pr --output json | jq -r '.data.plan_id')"
          ./hk qa pr --plan-id "$plan_id" --gate tracker-package
          test "$(jq -r .version frontend/tracker/package.json)" = "${VERSION#v}"
          cd frontend/tracker
          tarball="$(npm pack --ignore-scripts --json | jq -r '.[0].filename')"
          mv "$tarball" verified-tracker.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tracker-package-${{ inputs.version }}
          path: frontend/tracker/verified-tracker.tgz
          retention-days: ${{ inputs.stable_candidate && 30 || 1 }}
          compression-level: 0
          if-no-files-found: error

  package-chart:
    if: ${{ inputs.stable_candidate }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Package exact candidate chart
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '/^version:/ {print $2}' charts/hitkeep/Chart.yaml)" = "${VERSION#v}"
          helm lint --strict charts/hitkeep
          helm package charts/hitkeep --version "${VERSION#v}" --app-version "${VERSION#v}" --destination chart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-${{ inputs.version }}
          path: chart/*.tgz
          retention-days: ${{ inputs.stable_candidate && 30 || 1 }}
          if-no-files-found: error

  upgrade-from-supported-floor:
    name: Upgrade ${{ matrix.surface }} from supported floor
    if: ${{ inputs.stable_candidate }}
    needs: [build-and-push-image, package-chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        surface: [docker, compose, helm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - if: ${{ matrix.surface == 'helm' }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - if: ${{ matrix.surface == 'helm' }}
        run: go install sigs.k8s.io/kind@v0.33.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart-${{ inputs.version }}
          path: chart
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify exact candidate against immutable supported floor
        env:
          CANDIDATE_DIGEST: ${{ needs.build-and-push-image.outputs.image_digest }}
          VERSION: ${{ inputs.version }}
          SURFACE: ${{ matrix.surface }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          candidate="ghcr.io/${GITHUB_REPOSITORY,,}@${CANDIDATE_DIGEST}"
          docker pull "$candidate"
          platform="linux/$(docker image inspect "$candidate" --format '{{.Architecture}}')"
          manifest=tests/fixtures/release-fixtures.json
          previous_version="$(jq -r '.supported_upgrade_floor' "$manifest")"
          fixture="$(jq -ce --arg platform "$platform" --arg version "$previous_version" '[.fixtures[] | select(.previous_version == $version and .platform == $platform)] | if length == 1 then .[0] else error("ambiguous fixture") end' "$manifest")"
          export HITKEEP_PREVIOUS_IMAGE="$(jq -r .previous_image <<< "$fixture")"
          [[ "$HITKEEP_PREVIOUS_IMAGE" == *@sha256:* ]]
          if [[ "$SURFACE" == docker ]]; then
            ./scripts/docker-smoke.sh "$candidate" self-hosted --recreate
          elif [[ "$SURFACE" == compose ]]; then
            ./scripts/compose-smoke.sh "$candidate" self-hosted
          else
            kind_bin="$(go env GOPATH)/bin/kind"
            cluster="hitkeep-helm-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            trap '"$kind_bin" delete cluster --name "$cluster"' EXIT
            time "$kind_bin" create cluster --name "$cluster"
            previous_chart="$(jq -r .previous_chart <<< "$fixture")"
            previous_digest="$(jq -r .previous_chart_digest <<< "$fixture")"
            [[ "$previous_chart" == oci://* && "$previous_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            time previous_output="$(helm pull "$previous_chart" --version "$previous_version" --destination chart 2>&1)"
            grep -Fqx "Digest: $previous_digest" <<< "$previous_output"
            export HITKEEP_PREVIOUS_CHART="$PWD/chart/hitkeep-${previous_version#v}.tgz"
            export HITKEEP_PREVIOUS_CHART_DIGEST="$previous_digest"
            export HITKEEP_CANDIDATE_CHART="$PWD/chart/hitkeep-${VERSION#v}.tgz"
            export HITKEEP_CANDIDATE_CHART_VERSION="${VERSION#v}"
            time bash ./scripts/helm-smoke.sh "$candidate" self-hosted
          fi
      - name: Record tested digest
        env:
          DIGEST: ${{ needs.build-and-push-image.outputs.image_digest }}
          SURFACE: ${{ matrix.surface }}
        run: |
          mkdir evidence
          printf '%s\n' "$DIGEST" > "evidence/$SURFACE.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-evidence-${{ matrix.surface }}
          path: evidence/*.digest
          retention-days: ${{ inputs.stable_candidate && 30 || 1 }}
          if-no-files-found: error
