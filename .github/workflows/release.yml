name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Existing draft stable tag to explicitly rebuild and validate
        required: true
        type: string

permissions: {}

concurrency:
  group: release-candidate-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # Retained until replacement bot PR check triggering is proven.
          token: ${{ secrets.GHT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  resolve-candidate:
    needs: release-please
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # GitHub only exposes draft releases to tokens with push access.
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve immutable draft tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.candidate_tag || needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "$TAG" --json isDraft,isPrerelease | jq -e '.isDraft == true and .isPrerelease == false'
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object)"
          if [[ "$(jq -r .type <<< "$object")" == tag ]]; then
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .sha <<< "$object")" --jq .object)"
          fi
          test "$(jq -r .type <<< "$object")" = commit
          sha="$(jq -r .sha <<< "$object")"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" | jq -e '.status == "ahead" or .status == "identical"'
          printf 'tag=%s\nsha=%s\n' "$TAG" "$sha" >> "$GITHUB_OUTPUT"

  build-release:
    needs: resolve-candidate
    if: ${{ always() && needs.resolve-candidate.result == 'success' }}
    uses: $/.github/workflows/pipeline.yml
    permissions:
      contents: write # GitHub validates permissions of every nested job, including skipped uploads.
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      stable_candidate: true
      version: ${{ needs.resolve-candidate.outputs.tag }}
      checkout_ref: ${{ needs.resolve-candidate.outputs.sha }}
      meta_config: |
        type=raw,value=candidate-${{ github.run_id }}-${{ github.run_attempt }}
      upload_to_release: false
      release_tag_name: ${{ needs.resolve-candidate.outputs.tag }}
      release_source_tag: ${{ needs.resolve-candidate.outputs.tag }}
      release_source_sha: ${{ needs.resolve-candidate.outputs.sha }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  candidate:
    name: Certify complete release candidate
    needs: [resolve-candidate, build-release]
    if: ${{ always() && needs.resolve-candidate.result == 'success' && needs.build-release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # Tooling comes from the reviewed main workflow, including manual regeneration.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-linux-*
          path: candidate
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives-${{ needs.resolve-candidate.outputs.tag }}
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs-${{ needs.resolve-candidate.outputs.tag }}
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tracker-package-${{ needs.resolve-candidate.outputs.tag }}
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart-${{ needs.resolve-candidate.outputs.tag }}
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assistant-package-${{ needs.resolve-candidate.outputs.tag }}
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-archive-${{ needs.resolve-candidate.outputs.tag }}
          path: candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: upgrade-evidence-*
          path: evidence
          merge-multiple: true
      - name: Bind all mandatory evidence and verified bytes
        env:
          TAG: ${{ needs.resolve-candidate.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve-candidate.outputs.sha }}
          PRODUCER_WORKFLOW_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.build-release.outputs.image_digest }}
          DOCS_REVISION: ${{ vars.HITKEEP_DOCS_VALIDATION_SHA }}
          CANDIDATE_CHECKS: '{"native":"success","archives":"success","tracker":"success","chart":"success","docker":"success","compose":"success","helm":"success","docs":"success","assistant-package":"success","source-archive":"success"}'
        shell: bash
        run: |
          set -euo pipefail
          for surface in docker compose helm; do
            test "$(cat "evidence/$surface.digest")" = "$IMAGE_DIGEST"
          done
          export TESTED_IMAGE_DIGEST="$(cat evidence/docker.digest)"
          cd candidate
          sha256sum --check goreleaser-SHA256SUMS
          rm goreleaser-SHA256SUMS
          sha256sum hitkeep-cloud-linux-* hitkeep-linux-* hitkeep_*.tar.gz hitkeep-source-*.tar.gz hitkeep-analytics-*.zip verified-tracker.tgz hitkeep-*.tgz hitkeep-configuration.json hitkeep.example.yaml hitkeep-configuration-manifest.json | LC_ALL=C sort > SHA256SUMS
          sha256sum --check SHA256SUMS
          cd ..
          python3 scripts/release/candidate.py assemble --directory candidate
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: candidate/release-candidate.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Summarize candidate
        env:
          TAG: ${{ needs.resolve-candidate.outputs.tag }}
        run: |
          printf 'Validated %s; publication and receiver delivery have independent results.\n' "$TAG" >> "$GITHUB_STEP_SUMMARY"
