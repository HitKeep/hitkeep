name: Snapshot

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-snapshot:
    if: "${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    uses: $/.github/workflows/pipeline.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      version: snapshot-${{ github.sha }}
      meta_config: |
        type=raw,value=snapshot
        type=raw,value=main,enable={{is_default_branch}}
        type=ref,event=branch
        type=ref,event=pr
        type=sha,prefix=sha-,format=short
      upload_to_release: ${{ github.event_name == 'push' }}
      release_prerelease: ${{ github.event_name == 'push' }}
      release_tag_name: snapshot-${{ github.sha }}
      release_notes: |
        Automated snapshot build for main.

        - Commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      docker_tags_summary: |
        - `snapshot`
        - `main`
      docker_sha_tag_prefix: sha-
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
