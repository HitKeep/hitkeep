# Default to 1 (single node). Set to 2+ for clustering.
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/hitkeep/hitkeep
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion, normalized without a leading "v".
  tag: ""
  # Optional immutable image digest. When set, it takes precedence over tag.
  digest: ""

imagePullSecrets: []

serviceAccount:
  create: false
  name: ""

podAnnotations: {}
podLabels: {}

# Quick-start domain helper (used when ingress.hosts is empty)
domain: "hitkeep.local"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  path: "/"
  pathType: Prefix
  hosts: []
  tls: []

customTrackingDomains:
  enabled: false
  # Use "external" when TLS is terminated by your ingress controller, load
  # balancer, or certificate manager. Use "caddy-on-demand" only when an
  # external Caddy deployment calls HitKeep's ask endpoint.
  tlsMode: external
  # Optional DNS hostname or IP address that custom tracking domains must
  # resolve to. Empty defaults to the host in HITKEEP_PUBLIC_URL.
  dnsTarget: ""
  caddyAskToken:
    # Reference a Secret key containing HITKEEP_CADDY_TLS_ASK_TOKEN when
    # tlsMode is caddy-on-demand. You can also set this through extraEnv.
    existingSecret: ""
    existingSecretKey: token
  ingress:
    # Creates a separate tracking-only Ingress for static/custom hosts managed
    # by your cluster ingress controller. Caddy on-demand setups usually manage
    # this listener outside the chart.
    enabled: false
    className: ""
    annotations: {}
    pathType: Exact
    hosts: []
    tls: []

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  enabled: true
  size: 10Gi
  accessMode: ReadWriteOnce
  storageClass: ""
  mountPath: /var/lib/hitkeep/data
  annotations: {}

env:
  HITKEEP_HTTP_ADDR: ":8080"
  HITKEEP_PUBLIC_URL: "http://localhost:8080"

extraEnv: []
extraArgs: []
